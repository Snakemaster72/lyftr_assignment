name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          cp .env.example .env
          docker compose build
      - name: Backend tests inside the runtime image (catches missing cache-hit-path deps)
        run: |
          docker build --target test -t lyftr-chatbot-backend:test backend
          docker run --rm lyftr-chatbot-backend:test
      - name: Smoke test the composed stack
        run: |
          docker compose up -d --wait
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:3000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:3000/config.js
      - name: Image sizes
        if: always()
        run: docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep lyftr
      - name: Logs on failure
        if: failure()
        run: docker compose logs
