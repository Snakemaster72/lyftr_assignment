# Fly.io config for the backend. Deploy from this directory:  fly deploy --ha=false
# One machine only: SQLite lives on a single volume, so the app must not be scaled out.
app = "lyftr-chatbot-api"        # must be globally unique: change if taken
primary_region = "bom"           # Mumbai; pick the region closest to you/graders (fly platform regions)

[build]
  dockerfile = "Dockerfile"
  build-target = "runtime"

[env]
  DATABASE_URL = "sqlite:////data/app.db"
  ENABLE_FAILURE_SIMULATION = "true"
  LLM_MODEL = "groq/openai/gpt-oss-20b"
  CACHE_TYPE = "local"
  LOG_LEVEL = "INFO"
  # Set to the deployed frontend URL (comma-separate several):
  ALLOWED_ORIGINS = "https://REPLACE-WITH-FRONTEND-URL"
  # LLM_API_KEYS is a secret:  fly secrets set LLM_API_KEYS=key1,key2

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"     # never sleep: cold starts can time out the grader
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[mounts]]
  source = "app_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"               # the app idles at ~260 MB RSS (LiteLLM); 256 MB would OOM
